input_path: ./results/summary_statistics.tsv
output_dir: ./results/ml_rf_out
target_column: class
test_size: 0.2
cv_folds: 5
rare_class_policy: warn_reduce_cv
random_state: 42
n_jobs: -1

model:
  n_estimators: 200
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: sqrt
  class_weight: null

evaluation:
  metrics: all
  report_class_distribution: true
  report_confusion_matrix: true
  report_feature_importance: true
  save_label_map: true
  save_predictions: true
