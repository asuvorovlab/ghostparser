# Look at a handful of triplets in depth: every test measured for every
# triplet, every bootstrap iteration recorded, and the shape of each height
# distribution described. These records are costly, which is why the run is
# restricted to the triplets triplet_filter.txt names.
#
#   python -m ghostparser.orchestrator -c sample_configs/orchestrator_triplet_filter_diagnostic.yaml

species_tree_path: ./data/species.tree
gene_trees_path: ./data/genes.tree
outgroup: Out1

output_folder: ./results_diagnostic
triplet_filter: ./data/triplet_filter.txt   # one comma-separated triplet per line
seed: 42

diagnostic: true                  # fill every ks_* and perm_* column; same classifications
shape_diagnostics: true           # add the con_*/dis1_*/dis2_* shape columns

tree_height_calculation_strategy: INT   # the internal branch instead of the average height

bootstrap_options:
  iterations: 200
  diagnostic: true                # record every iteration's three tests
  summary_only: true              # as per-column summaries rather than full lists

permutation_options:
  min_resamples: 5000
  max_resamples: 50000
