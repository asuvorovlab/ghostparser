name: Build and Release

# Trigger on push of version tags or manual dispatch
on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v1.2.3, etc.
  workflow_dispatch:  # Allows manual triggering from GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Set package version from tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail

        TAG_NAME="${GITHUB_REF_NAME}"
        VERSION="${TAG_NAME#v}"

        if [ "${VERSION}" = "${TAG_NAME}" ] || [ -z "${VERSION}" ]; then
          echo "Expected tag format vX.Y.Z, got '${TAG_NAME}'"
          exit 1
        fi

        export VERSION
        python - <<'PY'
        import os
        import re
        from pathlib import Path

        version = os.environ["VERSION"]
        pyproject = Path("pyproject.toml")
        content = pyproject.read_text(encoding="utf-8")
        updated, count = re.subn(
          r'(?m)^version\s*=\s*"[^"]+"\s*$',
          f'version = "{version}"',
          content,
          count=1,
        )
        if count != 1:
          raise SystemExit("Could not find a single project version field in pyproject.toml")
        pyproject.write_text(updated, encoding="utf-8")
        print(f"Set package version to {version}")
        PY
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build distributions
      run: |
        python -m build
        
    - name: List built artifacts
      run: |
        ls -lh dist/

    - name: Check distributions
      run: |
        twine check dist/*

    - name: Prepare release notes from the changelog
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail

        TAG_NAME="${GITHUB_REF_NAME}"
        WHEEL_FILE="$(basename "$(ls dist/*.whl | head -n1)")"

        # The section under "## <tag>", up to the next "## " heading.
        awk -v tag="${TAG_NAME}" '
          /^## / { capture = ($2 == tag); if (capture) found = 1; next }
          capture { print }
          END { exit !found }
        ' CHANGELOG.md > CHANGELOG_SECTION.md || {
          echo "CHANGELOG.md has no '## ${TAG_NAME}' section; add one before tagging."
          exit 1
        }

        {
          cat CHANGELOG_SECTION.md
          echo
          echo "## Installation"
          echo
          echo '```bash'
          echo "pip install https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${WHEEL_FILE}"
          echo '```'
          echo
          echo "Documentation: https://asuvorovlab.github.io/ghostparser/"
        } > RELEASE_BODY.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        body_path: RELEASE_BODY.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync package version to main
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail

        TAG_NAME="${GITHUB_REF_NAME}"
        VERSION="${TAG_NAME#v}"
        DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git fetch origin "${DEFAULT_BRANCH}"
        git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"

        export VERSION
        python - <<'PY'
        import os
        import re
        from pathlib import Path

        version = os.environ["VERSION"]
        pyproject = Path("pyproject.toml")
        content = pyproject.read_text(encoding="utf-8")
        updated, count = re.subn(
          r'(?m)^version\s*=\s*"[^"]+"\s*$',
          f'version = "{version}"',
          content,
          count=1,
        )
        if count != 1:
          raise SystemExit("Could not find a single project version field in pyproject.toml")
        pyproject.write_text(updated, encoding="utf-8")
        print(f"Prepared pyproject.toml with version {version}")
        PY

        if git diff --quiet -- pyproject.toml; then
          echo "pyproject.toml already has version ${VERSION} on ${DEFAULT_BRANCH}; nothing to commit."
          exit 0
        fi

        git add pyproject.toml
        git commit -m "chore: bump package version to ${VERSION} for ${TAG_NAME} release"
        git push origin "${DEFAULT_BRANCH}"

    # Optional: Upload to PyPI (requires PyPI API token in repository secrets)
    # - name: Publish to PyPI
    #   if: startsWith(github.ref, 'refs/tags/')
    #   env:
    #     TWINE_USERNAME: __token__
    #     TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    #   run: |
    #     twine upload dist/*
