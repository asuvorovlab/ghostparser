name: Build and Release

# Trigger on push of version tags or manual dispatch
on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v1.2.3, etc.
  workflow_dispatch:  # Allows manual triggering from GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build distributions
      run: |
        python -m build
        
    - name: List built artifacts
      run: |
        ls -lh dist/

    - name: Prepare release notes from changelog
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail

        WHEEL_FILE="$(basename "$(ls dist/*.whl | head -n1)")"

        {
          echo "## Changelog"
          echo
          if [ -s CHANGELOG.md ]; then
            cat CHANGELOG.md
          else
            echo "_No changelog entries were provided for this release._"
          fi
          echo
          echo "## Installation"
          echo
          echo "Download the wheel file and install:"
          echo '```bash'
          echo "pip install ${WHEEL_FILE}"
          echo '```'
          echo
          echo "Or install directly from the release:"
          echo '```bash'
          echo "pip install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${WHEEL_FILE}"
          echo '```'
          echo
          echo "## Usage"
          echo "After installation, run from anywhere:"
          echo '```bash'
          echo "python -m ghostparser.orchestrator -c config.yaml"
          echo '```'
        } > RELEASE_BODY.md
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        body_path: RELEASE_BODY.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clear changelog after release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail

        DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git fetch origin "${DEFAULT_BRANCH}"
        git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"

        if [ ! -f CHANGELOG.md ]; then
          echo "CHANGELOG.md does not exist on ${DEFAULT_BRANCH}; nothing to clear."
          exit 0
        fi

        if [ ! -s CHANGELOG.md ]; then
          echo "CHANGELOG.md is already empty on ${DEFAULT_BRANCH}; nothing to clear."
          exit 0
        fi

        : > CHANGELOG.md
        git add CHANGELOG.md
        git commit -m "chore: clear changelog after ${GITHUB_REF_NAME} release"
        git push origin "${DEFAULT_BRANCH}"
        
    # Optional: Upload to PyPI (requires PyPI API token in repository secrets)
