[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostparser"
version = "0.1.2"
description = "Module to infer introgression patterns from species triplets using gene tree topologies and branch lengths."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"biopython>=1.79",
	"dendropy>=4.5.2",
	"numpy>=1.24",
	"scipy>=1.11",
	"statsmodels>=0.14",
	"PyYAML>=6.0",
	"matplotlib>=3.8",
	"seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ml = ["scikit-learn>=1.3.2"]
wandb = ["wandb>=0.18"]

[tool.setuptools]
[tool.setuptools.packages.find]
include = ["ghostparser*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
	"core: the statistics and decisions -- added automatically to every test not marked config, output or integration",
	"config: a loader, normalizer or validator; asserts on the resolved config or a ConfigError",
	"output: what was written -- files present, TSV columns, report fields, artifact routing -- not the numbers in them",
	"integration: drives an entry point end to end (run_orchestrator, train_random_forest, train_multi_knn, tune_hyperparameters)",
	"parity: cross-library parity checks (DendroPy vs BioPython tree operations)",
]
