site_name: Ghostparser Docs
site_description: Public documentation site generated from repository markdown files
repo_url: https://github.com/asuvorovlab/ghostparser

# Generated during CI from markdown files in the repository.
docs_dir: site_docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - toc
  - tables
  - fenced_code
  - sane_lists
  - pymdownx.superfences

use_directory_urls: true
