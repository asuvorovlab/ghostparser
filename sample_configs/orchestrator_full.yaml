# Every orchestrator key at its default; the comments give the accepted values.
# Copy it, set the three inputs, and keep only the keys you change.
#
#   python -m ghostparser.orchestrator -c sample_configs/orchestrator_full.yaml
#
# Paths are relative to the directory the command runs in. CONFIG.md describes
# every key.

# --- Inputs (required) -------------------------------------------------------
species_tree_path: ./sample_data/species.tree   # Newick, one tree
gene_trees_path: ./sample_data/genes.tree       # Newick, one tree per line
outgroup:                                       # one label, "Out1,Out2", or a list
  - Out1
  - Out2

# --- Output ------------------------------------------------------------------
output_folder: ./results      # reset before the run when overwrite is true
overwrite: true               # true | false (write to results_1, results_2, ...)

# --- Which triplets ----------------------------------------------------------
triplet_filter: null          # null | path: one "A,B,C" triplet per line
species_filter: null          # null | path: taxon names, comma-separated; not with triplet_filter
species_rename_map: null      # null | path: two-column TSV or YAML, tree label -> output name
min_support_value: 0.5        # number; trees with a lower mean node support are dropped

# --- Tests and decision ------------------------------------------------------
discordant_test: chi-square   # chi-square | z-test
tree_height_calculation_strategy: AVG   # AVG | A | B | C | SIS | INT
alpha_dct: 0.05               # number in (0, 1)
alpha_ks: 0.05                # number in (0, 1)
alpha_perm: 0.05              # number in (0, 1)
p_value_correction: bfn       # no | bfn | holm | fdr_bh | fdr_by
permutation_options:
  min_resamples: 2500         # integer >= 1; the first batch
  max_resamples: 25000        # integer >= min_resamples; the budget
  ci_method: wilson           # wilson | beta | agresti_coull | jeffreys | binom_test | normal
diagnostic: false             # true | false (measure every test for every triplet)

# --- Bootstrap support -------------------------------------------------------
bootstrap: true               # true | false (no bootstrap_value; faster)
bootstrap_options:
  iterations: 100             # integer >= 1
  diagnostic: false           # true | false (record every iteration's tests; costly)
  summary_only: false         # true | false (with diagnostic: per-column summaries only)

# --- Extra outputs -----------------------------------------------------------
consolidation: true           # true | false (the introgression maps)
generate_summary_stats: false # true | false (summary_statistics.tsv, the ML input)
shape_diagnostics: false      # true | false (per-group shape columns; costly)

# --- Execution ---------------------------------------------------------------
processes: 0                  # integer >= 0; 0 = every CPU available to the run
seed: null                    # null (drawn and reported) | integer

# --- Input check -------------------------------------------------------------
preflight_data_check: false   # true | false (check the inputs, write the report, exit)
preflight_triplet_cap: 15000  # integer >= 0; 0 = check every triplet
