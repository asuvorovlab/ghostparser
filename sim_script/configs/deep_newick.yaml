# Introgression deep in a fixed tree: between two ancestral lineages, from an
# unsampled ghost into an ancestor, and between two sampled tips. A list of
# species names the branch above their most recent common ancestor.
#
#   python sim_script/simulate_trees.py -c sim_script/configs/deep_newick.yaml

seed: 2
output_dir: ./sim_out/deep_newick
time_units: coalescent

species_tree:
  model: newick
  newick: "((((((A:0.5,B:0.5):0.5,C:1.0):1.0,(D:1.0,E:1.0):1.0):1.0,F:3.0):0.5,Gh:3.5):0.5,Out:4.0);"
outgroup: Out
ghosts: [Gh]

introgression:
  # ancestor of D and E into the ancestor of A, B and C (both span 1.0 to 2.0)
  - {donor: [D, E], recipient: [A, B, C], time_fraction: 0.5, proportion: 0.2}
  # the ghost, which branches off at 3.5, into the ancestor of A to E (spans 2.0 to 3.0)
  - {donor: Gh, recipient: [A, B, C, D, E], time: 2.5, proportion: 0.15}
  # C into B
  - {donor: C, recipient: B, time_fraction: 0.5, proportion: 0.1}

gene_tree_count: 2000
