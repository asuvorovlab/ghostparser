[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostparser"
version = "0.1.1"
description = "Module to infer introgression patterns from species triplets using gene tree topologies and branch lengths."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
	"biopython>=1.79",
	"dendropy>=4.5.2",
	"scipy>=1.11",
	"statsmodels>=0.14",
	"PyYAML>=6.0",
	"pyarrow>=15.0",
	"matplotlib>=3.8",
	"seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ml = ["scikit-learn>=1.3.2"]

[tool.setuptools]
[tool.setuptools.packages.find]
include = ["ghostparser*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
	"backend_parity: tests that compare custom and standard backends for equivalent behavior",
]
