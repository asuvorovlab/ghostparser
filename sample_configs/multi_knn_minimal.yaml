input_path: results/summary_statistics.tsv
output_dir: results/multi_knn_results
target_column: classes
test_size: 0.2
cv_folds: 5
rare_class_policy: warn_reduce_cv
random_state: 42
n_jobs: -1

model:
  n_neighbors: 5
  weights: uniform
  algorithm: auto
  leaf_size: 30
  metric: minkowski
  p: 2

evaluation:
  metrics: all
  report_class_distribution: true
  report_confusion_matrix: true
  report_feature_importance: true
  save_label_map: true
  save_predictions: true
