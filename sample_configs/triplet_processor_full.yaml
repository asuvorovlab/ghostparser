input_path: data/asuv21/asuv_all/unique_triplets_gene_trees.txt
output_path: data/asuv21/asuv_all/triplet_introgression_results.tsv
stats_output: data/asuv21/asuv_all/triplet_introgression_results.json
alpha_dct: 0.01
alpha_ks: 0.05
discordant_test: chi-square
summary_statistic: median
stats_backend: standard
tree_height_calculation_strategy: AVG
p_value_correction: bfn
processes: 0
no_multiprocessing: false
bootstrap: true
bootstrap_options:
  iterations: 100
  seed: 42
  debug_mode: true
  summary_only: true
