name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "CONFIG.md"
      - "ghostparser/**/*.md"
      - "mkdocs.yml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install MkDocs and docs plugins in isolated venv
        run: |
          python -m venv .docs-venv
          . .docs-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip cache purge || true
          pip install --no-cache-dir "mkdocs<2" mkdocs-material

      - name: Show resolved docs tool versions
        run: |
          . .docs-venv/bin/activate
          python -c "import mkdocs, material; print('mkdocs', mkdocs.__version__); print('mkdocs-material', material.__version__)"

      - name: Prepare Markdown docs tree
        run: |
          rm -rf site_docs
          mkdir -p site_docs/ghostparser/orchestrator site_docs/ghostparser/ml

          # The user docs only, at their repository paths so relative links hold.
          cp README.md site_docs/index.md
          cp CONFIG.md site_docs/CONFIG.md
          cp ghostparser/orchestrator/ORCHESTRATOR.md site_docs/ghostparser/orchestrator/
          cp ghostparser/ml/ML.md site_docs/ghostparser/ml/

          # The README is the site's index.md, so point links at it there.
          find site_docs -name '*.md' -exec \
            sed -i 's#\](\(\(\.\./\)*\)README\.md#](\1index.md#g' {} +

      - name: Build static site
        run: |
          . .docs-venv/bin/activate
          mkdocs build --clean --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
